<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>畢製追蹤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f8;--bg2:#ecedf2;--bg3:#e2e4eb;--card:#ffffff;--card2:#f7f8fb;
  --border:#d8dae4;--border2:#c8cad8;
  --text:#1a1c2e;--text2:#5a5c78;--text3:#9a9cb8;
  --amber:#c47a00;--teal:#0a8a68;--rose:#d03060;--blue:#2060c0;--purple:#6040c0;
  --done:#0a8a68;--current:#c47a00;--blocked:#d03060;--upcoming:#9a9cb8;
  --r:8px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;font-size:15px}
.mono{font-family:'DM Mono',monospace}
input,select,textarea{font-family:'Noto Sans TC',sans-serif;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:8px 12px;font-size:15px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:60px}
button{font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s}
.btn{padding:7px 14px;background:var(--card2);color:var(--text2);border:1px solid var(--border2)}
.btn:hover{color:var(--text);border-color:var(--border2)}
.btn-amber{background:rgba(240,184,64,.15);color:var(--amber);border:1px solid rgba(240,184,64,.3)}
.btn-amber:hover{background:rgba(240,184,64,.25)}
.btn-teal{background:rgba(45,232,176,.1);color:var(--teal);border:1px solid rgba(45,232,176,.3)}
.btn-rose{background:rgba(240,96,128,.1);color:var(--rose);border:1px solid rgba(240,96,128,.3)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text2);border-color:var(--border2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
label{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:4px;letter-spacing:.3px}
.fg{margin-bottom:12px}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:52px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0}
.sib{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;background:transparent;border:none;color:var(--text3)}
.sib:hover{background:var(--bg3);color:var(--text)}
.sib.active{background:var(--amber);color:#000}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:700;flex:1}
.page{flex:1;overflow-y:auto;padding:20px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:8px 18px;font-size:12px;font-weight:600;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}

/* Status dots */
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sdot.done{background:var(--done)}
.sdot.current{background:var(--amber)}
.sdot.blocked{background:var(--rose)}
.sdot.upcoming{background:var(--upcoming)}

/* TODAY */
.focus-card{background:linear-gradient(135deg,rgba(196,122,0,.06),rgba(196,122,0,.02));border:1px solid rgba(240,184,64,.3);border-radius:var(--r);padding:16px;margin-bottom:16px}
.focus-label{font-size:10px;color:var(--amber);font-family:'DM Mono',monospace;letter-spacing:2px;margin-bottom:8px}
.focus-text{font-size:15px;font-weight:700;line-height:1.5}
.week-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.week-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}

/* Task tree */
.task-tree{display:flex;flex-direction:column;gap:6px}
.task-node{border-radius:6px;border:1px solid var(--border);overflow:hidden;transition:border .15s}
.task-node.unlocked{border-color:var(--border2)}
.task-node.locked{opacity:.5}
.task-node.done-node{opacity:.4}
.task-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
.task-head:hover{background:var(--card2)}
.task-name{flex:1;font-size:14px;font-weight:600}
.task-node.locked .task-name{color:var(--text3)}
.task-meta{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.task-body{padding:10px 12px 12px;background:var(--bg3);border-top:1px solid var(--border);display:none}
.task-body.open{display:block}
.task-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.task-deps{font-size:11px;color:var(--rose);margin-bottom:8px}
.task-children{margin-top:8px;padding-left:12px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:4px}

/* Line badge */
.line-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;font-family:'DM Mono',monospace;flex-shrink:0}
.line-pack{background:rgba(160,128,240,.15);color:var(--purple)}
.line-exhibit{background:rgba(45,232,176,.1);color:var(--teal)}
.line-stall{background:rgba(196,122,0,.12);color:var(--amber)}
.line-other{background:rgba(96,168,240,.1);color:var(--blue)}

/* Status select */
.status-sel{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.status-opt{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text3);transition:all .15s}
.status-opt.active-done{background:rgba(45,232,176,.15);color:var(--teal);border-color:rgba(45,232,176,.4)}
.status-opt.active-current{background:rgba(240,184,64,.15);color:var(--amber);border-color:rgba(240,184,64,.4)}
.status-opt.active-blocked{background:rgba(240,96,128,.15);color:var(--rose);border-color:rgba(240,96,128,.4)}
.status-opt.active-upcoming{background:var(--bg3);color:var(--text2);border-color:var(--border2)}

/* Week plan */
.week-plan{margin-bottom:20px}
.week-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.week-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);padding:2px 8px;border:1px solid var(--border);border-radius:10px}
.week-task-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:4px;cursor:pointer}
.week-task-row:hover{border-color:var(--border2)}
.week-task-row.done-row{opacity:.4}
.week-task-text{flex:1;font-size:13px}

/* Memo / feedback */
.memo-row{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px}
.memo-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);margin-bottom:4px}
.memo-text{font-size:14px;line-height:1.6;white-space:pre-wrap}

/* Mobile */
@media(max-width:640px){
  /* 解除固定高度，改成可滑動 */
  .app{display:block}
  .sidebar{width:100%;height:58px;flex-direction:row;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid var(--border);border-right:none;border-bottom:none;padding:0 4px;gap:0;background:var(--bg2)}
  .sib{width:44px;height:44px;border-radius:10px;font-size:20px}
  .main{display:block;padding-bottom:72px;min-height:100vh;overflow:visible}
  .topbar{height:46px;padding:0 14px;position:sticky;top:0;z-index:40;background:var(--bg2)}
  .topbar-title{font-size:15px}
  .page{padding:14px 12px;font-size:15px;height:auto;overflow:visible}
  .page-header{margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .page-title{font-size:17px}
  /* 卡片 */
  .card{padding:14px;margin-bottom:10px}
  .focus-card{padding:14px;margin-bottom:10px!important}
  .focus-text{font-size:15px}
  /* 任務列 */
  .week-task-row{padding:12px 10px;gap:8px;flex-wrap:wrap;align-items:flex-start}
  .week-task-text{font-size:14px;flex:1;min-width:0;line-height:1.4}
  .memo-text{font-size:14px;line-height:1.6}
  .memo-row{padding:14px;margin-bottom:8px}
  .line-badge{font-size:11px;padding:3px 9px;flex-shrink:0}
  /* 防止 iOS 放大輸入欄位 */
  input,select,textarea{font-size:16px !important;min-height:44px !important}
  /* 按鈕加大點擊區 */
  .btn-sm{padding:7px 14px;font-size:12px;min-height:36px}
  .btn{padding:10px 16px;min-height:44px}
  .btn-amber,.btn-teal,.btn-rose{min-height:44px}
  .status-sel{gap:6px}
  .status-opt{padding:8px 14px;font-size:13px;min-height:40px}
  .modal-footer{gap:8px;margin-top:20px}
  .modal-footer button{padding:12px 16px;font-size:14px;flex:1;min-height:48px}
  /* modal 從底部滑出 */
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-width:100%;max-height:92vh;padding:20px 16px 36px}
  .modal-title{font-size:16px;margin-bottom:18px}
  .week-task-row > div[onclick]{flex-shrink:0}
  .task-children{padding-left:8px}
  .week-plan{margin-bottom:16px}
}
@media(min-width:641px) and (max-width:900px){
  .sidebar{width:44px}
  .sib{width:32px;height:32px}
  .page{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">畢製追蹤</div>
      <div class="mono" style="font-size:11px;color:var(--text3)" id="topbarDate"></div>
      <button class="btn btn-sm btn-ghost" onclick="openWeeklyReport()" title="產生週報給 Claude">📋</button>
      <button class="btn btn-sm" onclick="manualSave()">💾</button>
    </div>
    <div class="page" id="pageContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════
// CONFIG
// ═══════════════════════════════
const API_URL = '';
const KEY = 'grad_v5';
const TODAY = new Date().toISOString().slice(0,10);
const CUR_WEEK = getWeekNum(TODAY);

function getWeekNum(dateStr){
  const start = new Date('2025-03-19'); // 學期開始
  const d = new Date(dateStr);
  return Math.ceil((d - start) / (7*24*60*60*1000)) + 1;
}
function weeksLeft(deadline){
  const d = new Date(deadline);
  const t = new Date(TODAY);
  return Math.ceil((d - t) / (7*24*60*60*1000));
}

// ═══════════════════════════════
// DATA
// ═══════════════════════════════
function defDB(){
  return {
    _updatedAt:'',
    apiUrl: API_URL,
    // 週計畫
    weekPlans: [
      // 包裝線
      {id:'w1p1',week:1,line:'pack',text:'確定精露組產品結構（不回頭）',status:'current',note:''},
      {id:'w1p2',week:1,line:'pack',text:'畫5張精露噴霧草稿（植物圖鑑風格）',status:'upcoming',note:'',blockedBy:[]},
      {id:'w2p1',week:2,line:'pack',text:'Moodboard完成，與老師確認視覺方向',status:'upcoming',note:'',blockedBy:['w1p1']},
      {id:'w2p2',week:2,line:'pack',text:'LOGO第一版草稿',status:'upcoming',note:'',blockedBy:['w1p2']},
      {id:'w3p1',week:3,line:'pack',text:'瓶身標籤設計提案2-3版',status:'upcoming',note:'',blockedBy:['w2p1','w2p2']},
      {id:'w4p1',week:4,line:'pack',text:'單品包裝設計，老師review',status:'upcoming',note:'',blockedBy:['w3p1']},
      {id:'w5p1',week:5,line:'pack',text:'禮盒設計（若做）',status:'upcoming',note:'',blockedBy:['w4p1']},
      {id:'w6p1',week:6,line:'pack',text:'全部定稿，送印',status:'upcoming',note:'',blockedBy:['w5p1']},
      {id:'w7p1',week:7,line:'pack',text:'收件確認印刷品質',status:'upcoming',note:'',blockedBy:['w6p1']},
      // 擺攤線
      {id:'s1a',week:1,line:'stall',text:'確定攤位品牌概念（名稱/主色/調性）',status:'upcoming',note:'',blockedBy:[]},
      {id:'s2a',week:2,line:'stall',text:'攤位平面配置草圖（動線/擺設）',status:'upcoming',note:'',blockedBy:['s1a']},
      {id:'s2b',week:2,line:'stall',text:'宣傳影片腳本完成',status:'upcoming',note:'',blockedBy:['s1a']},
      {id:'s3a',week:3,line:'stall',text:'影片拍攝（協作組員）',status:'upcoming',note:'',blockedBy:['s2b']},
      {id:'s3b',week:3,line:'stall',text:'道具／器材清單確認＋採購',status:'upcoming',note:'',blockedBy:['s2a']},
      {id:'s4a',week:4,line:'stall',text:'影片剪輯輸出',status:'upcoming',note:'',blockedBy:['s3a']},
      {id:'s4b',week:4,line:'stall',text:'攤位視覺設計（banner/標牌）',status:'upcoming',note:'',blockedBy:['s2a']},
      {id:'s5a',week:5,line:'stall',text:'攤位道具製作／到位確認',status:'upcoming',note:'',blockedBy:['s3b','s4b']},
      {id:'s6a',week:6,line:'stall',text:'影片上傳測試、播放設備確認',status:'upcoming',note:'',blockedBy:['s4a']},
      {id:'s7a',week:7,line:'stall',text:'現場布置演練',status:'upcoming',note:'',blockedBy:['s5a','s6a']},
      // 畢展線
      {id:'w1e1',week:1,line:'exhibit',text:'問老師海報/邀卡要加什麼（本週最重要）',status:'current',note:'這個不解決整條印刷線卡死'},
      {id:'w2e1',week:2,line:'exhibit',text:'海報/邀卡定稿',status:'upcoming',note:'',blockedBy:['w1e1']},
      {id:'w3e1',week:3,line:'exhibit',text:'發包印刷',status:'upcoming',note:'',blockedBy:['w2e1']},
      {id:'w3e2',week:3,line:'exhibit',text:'開始場地規劃（動線/攤位）',status:'upcoming',note:''},
      {id:'w4e1',week:4,line:'exhibit',text:'大型輸出尺寸確認',status:'upcoming',note:'',blockedBy:['w3e1']},
      {id:'w4e2',week:4,line:'exhibit',text:'場地動線確認',status:'upcoming',note:'',blockedBy:['w3e2']},
      {id:'w6e1',week:6,line:'exhibit',text:'所有印刷收件',status:'upcoming',note:'',blockedBy:['w3e1']},
      {id:'w7e1',week:7,line:'exhibit',text:'布展準備',status:'upcoming',note:'',blockedBy:['w6e1','w4e2']},
    ],
    // 老師回饋
    feedbacks: [],
    // 廠商
    vendors: [],
    // 隨手記
    memos: [],
    // 待決策
    decisions: [],
    // 其他作業
    assignments: [],
  };
}

let db = (() => { try{ return JSON.parse(localStorage.getItem(KEY)) || defDB(); } catch{ return defDB(); } })();

function saveDB(){
  db._updatedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(db));
}

// ═══════════════════════════════
// SYNC
// ═══════════════════════════════
function setSyncState(s){
  const el = document.getElementById('topbarDate');
  if(!el) return;
  const states = {ok:'✓ 已同步',err:'✗ 同步失敗',loading:'⟳ 同步中'};
  el.textContent = states[s] || TODAY;
  el.style.color = s==='ok'?'var(--teal)':s==='err'?'var(--rose)':'var(--amber)';
  if(s==='ok'||s==='err') setTimeout(()=>{el.textContent=TODAY;el.style.color='var(--text3)';},3000);
}
async function pushSync(){
  if(!db.apiUrl) return;
  setSyncState('loading');
  try{
    const resp = await fetch(db.apiUrl,{method:'POST',body:JSON.stringify({action:'saveAll',data:db})});
    const r = await resp.json();
    if(r.ok) setSyncState('ok'); else throw new Error(r.error);
  }catch(e){ setSyncState('err'); console.warn(e); throw e; }
}
function manualSave(){
  saveDB();
  if(db.apiUrl) pushSync().then(()=>toast('✅ 已存檔')).catch(()=>toast('❌ 存檔失敗'));
  else { toast('✓ 已存本機'); }
}
let _debTimer = null;
function save(){ saveDB(); clearTimeout(_debTimer); _debTimer = setTimeout(()=>{ if(db.apiUrl) pushSync(); }, 3000); }

// ═══════════════════════════════
// UTILS
// ═══════════════════════════════
const uid = () => '_'+Math.random().toString(36).slice(2,8);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function isUnlocked(task){
  if(!task.blockedBy||!task.blockedBy.length) return true;
  return task.blockedBy.every(depId=>{
    const dep = db.weekPlans.find(t=>t.id===depId);
    return dep && dep.status==='done';
  });
}
function statusLabel(s){
  return {done:'✅ 完成',current:'🔥 進行中',blocked:'🔒 被擋住',upcoming:'⬜ 待辦'}[s]||s;
}
function lineName(l){
  return {pack:'📦 包裝',exhibit:'🎨 畢展',stall:'🍵 擺攤',other:'📌 其他'}[l]||l;
}

// ═══════════════════════════════
// NAV
// ═══════════════════════════════
const NAV = [
  {id:'today',icon:'◈',label:'TODAY'},
  {id:'pack',icon:'📦',label:'包裝線'},
  {id:'exhibit',icon:'🎨',label:'畢展線'},
  {id:'stall',icon:'🍵',label:'擺攤線'},
  {id:'assignments',icon:'📚',label:'其他作業'},
  {id:'feedback',icon:'💬',label:'老師回饋'},
  {id:'vendor',icon:'🏭',label:'廠商'},
  {id:'memo',icon:'📝',label:'隨手記'},
  {id:'settings',icon:'⚙',label:'設定'},
];
let activeTab = 'today';
let openTaskId = null;

function renderNav(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = NAV.map(n=>`
    <button class="sib${activeTab===n.id?' active':''}" onclick="goto('${n.id}')" title="${n.label}">
      <span style="font-size:15px">${n.icon}</span>
    </button>`).join('');
}
function goto(tab){ activeTab=tab; renderAll(); }
function renderAll(){ renderNav(); renderPage(); }

// ═══════════════════════════════
// PAGES
// ═══════════════════════════════
function renderPage(){
  const t = document.getElementById('topbarTitle');
  const el = document.getElementById('pageContent');
  const titles = {today:'TODAY',pack:'📦 包裝線',exhibit:'🎨 畢展線',stall:'🍵 擺攤線',assignments:'📚 其他作業',feedback:'💬 老師回饋',vendor:'🏭 廠商資料',memo:'📝 隨手記',settings:'⚙ 設定'};
  if(t) t.textContent = titles[activeTab]||'畢製追蹤';
  switch(activeTab){
    case 'today':       el.innerHTML = pageToday(); break;
    case 'pack':        el.innerHTML = pageLine('pack'); break;
    case 'exhibit':     el.innerHTML = pageLine('exhibit'); break;
    case 'stall':       el.innerHTML = pageLine('stall'); break;
    case 'assignments': el.innerHTML = pageAssignments(); break;
    case 'feedback':    el.innerHTML = pageFeedback(); break;
    case 'vendor':      el.innerHTML = pageVendor(); break;
    case 'memo':        el.innerHTML = pageMemo(); break;

// ─── LINE PAGE ───
function pageLine(line){
  const tasks = db.weekPlans.filter(t=>t.line===line);
  const weeks = [...new Set(tasks.map(t=>t.week))].sort((a,b)=>a-b);
  const done = tasks.filter(t=>t.status==='done').length;

  return `
  <div class="page-header">
    <div>
      <div class="page-title">${lineName(line)}</div>
      <div class="page-sub mono">完成 ${done}/${tasks.length}</div>
    </div>
    <button class="btn btn-amber btn-sm" onclick="openAddTask('${line}')">＋ 新增任務</button>
  </div>
  <div style="height:4px;background:var(--bg3);border-radius:2px;margin-bottom:20px">
    <div style="height:4px;background:var(--${line==='pack'?'amber':line==='stall'?'amber':'teal'});border-radius:2px;width:${tasks.length?Math.round(done/tasks.length*100):0}%;transition:width .3s"></div>
  </div>
  ${weeks.map(w=>{
    const wtasks = tasks.filter(t=>t.week===w);
    const wDone = wtasks.filter(t=>t.status==='done').length;
    const isCur = w===CUR_WEEK;
    return `
    <div class="week-plan">
      <div class="week-header">
        <span class="week-num" style="${isCur?'border-color:var(--amber);color:var(--amber)':''}">W${w}</span>
        <span style="font-size:11px;color:var(--text3)">${wDone}/${wtasks.length} 完成</span>
        ${isCur?'<span style="font-size:10px;color:var(--amber);font-family:\'DM Mono\',monospace">← 本週</span>':''}
      </div>
      ${wtasks.map(t=>{
        const unlocked = isUnlocked(t);
        return `<div class="week-task-row${t.status==='done'?' done-row':''}${!unlocked?' locked':''}" onclick="openTaskModal('${t.id}')">
          <div class="sdot ${t.status==='done'?'done':t.status==='current'?'current':unlocked?'upcoming':'blocked'}"></div>
          <div class="week-task-text">${esc(t.text)}</div>
          ${t.note?`<span style="font-size:10px;color:var(--text3)">有備注</span>`:''}
          ${!unlocked?'<span style="font-size:10px;color:var(--rose)">🔒</span>':''}
          <div style="display:flex;gap:4px" onclick="event.stopPropagation()">
            ${t.status!=='done'?`<button class="btn btn-sm btn-ghost" onclick="markDone('${t.id}')">✓</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}`;
}

function renderAssignmentCard(a){
  const daysLeft = a.deadline ? Math.ceil((new Date(a.deadline)-new Date(TODAY))/(86400000)) : null;
  const urgent = daysLeft!==null && daysLeft<=3 && !a.done;
  const tasks = a.tasks||[];
  const mats = a.materials||[];
  const doneCount = tasks.filter(t=>t.done).length;
  return `
  <div class="card" style="margin-bottom:10px;${a.done?'opacity:.45':''}${urgent?';border-color:var(--rose)':''}">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:${tasks.length||mats.length||a.plan?'10':'0'}px">
      <div style="flex:1">
        <div style="font-weight:700;font-size:15px">${esc(a.name)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${esc(a.course||'')}${a.deadline?` · 截止 ${a.deadline}`:''}${daysLeft!==null&&!a.done?` <span style="color:${urgent?'var(--rose)':'var(--text3)'}">(${daysLeft>0?daysLeft+'天後':daysLeft===0?'今天':'已過期'})</span>`:''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        ${!a.done?`<button class="btn btn-teal btn-sm" onclick="doneAssignment('${a.id}')">✓</button>`:`<button class="btn btn-ghost btn-sm" onclick="undoAssignment('${a.id}')">↩</button>`}
        <button class="btn btn-ghost btn-sm" onclick="openEditAssignment('${a.id}')">編輯</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteAssignment('${a.id}')">✕</button>
      </div>
    </div>
    ${tasks.length?`
    <div style="margin-bottom:8px">
      <div style="font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:4px">子任務 ${doneCount}/${tasks.length}</div>
      ${tasks.map(t=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleSubtask('${a.id}','${t.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--teal);flex-shrink:0">
          <span style="font-size:13px;${t.done?'text-decoration:line-through;color:var(--text3)':''}">${esc(t.text)}</span>
        </div>`).join('')}
    </div>`:''}
    ${mats.length?`
    <div style="margin-bottom:8px">
      <div style="font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:4px">材料</div>
      ${mats.map(m=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
          <input type="checkbox" ${m.done?'checked':''} onchange="toggleMaterial('${a.id}','${m.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--purple);flex-shrink:0">
          <span style="font-size:12px;color:var(--text2);${m.done?'text-decoration:line-through;color:var(--text3)':''}">${esc(m.text)}</span>
        </div>`).join('')}
    </div>`:''}
    ${a.plan?`<div style="font-size:12px;color:var(--text2);padding:6px 8px;background:var(--bg3);border-radius:4px;white-space:pre-wrap">${esc(a.plan)}</div>`:''}
  </div>`;
}

function openAddAssignment(){
  showModal(`

    <div class="fg"><label>作業名稱</label><input type="text" id="aName" placeholder="例：品牌識別設計"></div>

    <div class="fg"><label>材料清單（每行一項）</label><textarea id="aMats" placeholder="A3 紙&#10;黑色代針筆"></textarea></div>

function saveNewAssignment(){
  const name = document.getElementById('aName').value.trim();
  if(!name){toast('請填作業名稱');return;}
  const tasks = document.getElementById('aTasks').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({id:uid(),text:s,done:false}));
  const mats = document.getElementById('aMats').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({id:uid(),text:s,done:false}));
  if(!db.assignments) db.assignments=[];
  db.assignments.push({id:uid(),name,course:document.getElementById('aCourse').value.trim(),deadline:document.getElementById('aDeadline').value,tasks,materials:mats,plan:document.getElementById('aPlan').value.trim(),done:false});
  save();closeModal();renderPage();toast('✓ 已新增');
}

function openEditAssignment(id){
  const a=(db.assignments||[]).find(x=>x.id===id);if(!a)return;
  showModal(`
    <div class="modal-title">編輯作業</div>
    <div class="fg"><label>作業名稱</label><input type="text" id="aName" value="${esc(a.name)}"></div>
    <div class="fg"><label>課名</label><input type="text" id="aCourse" value="${esc(a.course||'')}"></div>
    <div class="fg"><label>截止日</label><input type="date" id="aDeadline" value="${esc(a.deadline||'')}"></div>
    <div class="fg"><label>子任務（每行一項）</label><textarea id="aTasks">${esc((a.tasks||[]).map(t=>t.text).join('\n'))}</textarea></div>
    <div class="fg"><label>材料清單（每行一項）</label><textarea id="aMats">${esc((a.materials||[]).map(m=>m.text).join('\n'))}</textarea></div>
    <div class="fg"><label>製作計畫 / 備注</label><textarea id="aPlan">${esc(a.plan||'')}</textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-amber" onclick="saveEditAssignment('${id}')">儲存</button>
    </div>`);
}

function saveEditAssignment(id){
  const a=(db.assignments||[]).find(x=>x.id===id);if(!a)return;
  const name=document.getElementById('aName').value.trim();
  if(!name){toast('請填作業名稱');return;}
  const newTaskTexts=document.getElementById('aTasks').value.split('\n').map(s=>s.trim()).filter(Boolean);
  a.tasks=newTaskTexts.map(text=>{const ex=(a.tasks||[]).find(t=>t.text===text);return ex||{id:uid(),text,done:false};});
  const newMatTexts=document.getElementById('aMats').value.split('\n').map(s=>s.trim()).filter(Boolean);
  a.materials=newMatTexts.map(text=>{const ex=(a.materials||[]).find(m=>m.text===text);return ex||{id:uid(),text,done:false};});
  a.name=name;a.course=document.getElementById('aCourse').value.trim();a.deadline=document.getElementById('aDeadline').value;a.plan=document.getElementById('aPlan').value.trim();
  save();closeModal();renderPage();toast('✓ 已儲存');
}

function toggleSubtask(aid,tid,checked){const a=(db.assignments||[]).find(x=>x.id===aid);if(!a)return;const t=(a.tasks||[]).find(x=>x.id===tid);if(!t)return;t.done=checked;save();}
function toggleMaterial(aid,mid,checked){const a=(db.assignments||[]).find(x=>x.id===aid);if(!a)return;const m=(a.materials||[]).find(x=>x.id===mid);if(!m)return;m.done=checked;save();}
function doneAssignment(id){const a=(db.assignments||[]).find(x=>x.id===id);if(!a)return;a.done=true;save();renderPage();toast('✅ 完成！');}
function undoAssignment(id){const a=(db.assignments||[]).find(x=>x.id===id);if(!a)return;a.done=false;save();renderPage();}
function deleteAssignment(id){if(!confirm('刪除這個作業？'))return;db.assignments=(db.assignments||[]).filter(x=>x.id!==id);save();renderPage();toast('已刪除');}

function saveApiUrl(){ db.apiUrl=document.getElementById('apiInp').value.trim(); save(); toast('✓ 已儲存'); }
function clearAll(){ localStorage.removeItem(KEY); location.reload(); }
async function pullSync(){
  if(!db.apiUrl){alert('請先設定URL');return;}
  try{
    const r = await new Promise((res,rej)=>{
      const cb='_gc'+Date.now(); window[cb]=d=>{delete window[cb];res(d);};
      const s=document.createElement('script');
      s.onerror=()=>rej(new Error('error'));
      s.src=db.apiUrl+'?action=getAll&callback='+cb+'&t='+Date.now();
      setTimeout(()=>rej(new Error('timeout')),15000);
      document.head.appendChild(s);
    });
    if(r&&!r.error){ Object.assign(db,r); saveDB(); renderAll(); toast('✓ 已從雲端載入'); }
  }catch(e){ toast('❌ 拉取失敗'); }
}

// WEEKLY REPORT
// ═══════════════════════════════
function openWeeklyReport(){
  const report = generateReport();
  showModal(`
    <div class="modal-title">📋 週報 — 貼給 Claude</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">複製以下內容，貼給 Claude 討論進度或調整任務</div>
    <textarea id="reportText" style="font-size:12px;font-family:'DM Mono',monospace;line-height:1.6;min-height:320px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:12px;width:100%;resize:vertical" readonly>${report}</textarea>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">關閉</button>
      <button class="btn btn-amber" onclick="copyReport()">複製全部</button>
    </div>`);
  // auto-select
  setTimeout(()=>{const el=document.getElementById('reportText');if(el){el.select();}},100);
}

function copyReport(){
  const el=document.getElementById('reportText');
  if(!el)return;
  el.select();
  try{
    navigator.clipboard.writeText(el.value).then(()=>toast('✓ 已複製！貼給 Claude 吧'));
  }catch(e){
    document.execCommand('copy');
    toast('✓ 已複製！');
  }
}

function generateReport(){
  const lines = ['pack','exhibit','stall'];
  const lineNames = {pack:'📦 包裝',exhibit:'🎨 畢展',stall:'🍵 擺攤'};
  const wLeft = {pack:weeksLeft('2025-05-10'),exhibit:weeksLeft('2025-05-23'),stall:weeksLeft('2025-05-23')};
  const now = new Date().toLocaleDateString('zh-TW');
  let r = '';

  r += `═══════════════════════════\n`;
  r += `畢製週報 ${now}（W${CUR_WEEK}）\n`;
  r += `═══════════════════════════\n\n`;

  // 各線進度
  r += `【各線進度】\n`;
  lines.forEach(line=>{
    const tasks = db.weekPlans.filter(t=>t.line===line);
    const done = tasks.filter(t=>t.status==='done').length;
    const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
    const bar = '█'.repeat(Math.round(pct/10))+'░'.repeat(10-Math.round(pct/10));
    r += `${lineNames[line]}  ${bar}  ${done}/${tasks.length} (${pct}%)  剩 ${wLeft[line]} 週\n`;
  });
  r += '\n';

  // 本週完成
  const doneThisWeek = db.weekPlans.filter(t=>t.status==='done'&&t.week===CUR_WEEK);
  r += `【本週完成】\n`;
  if(doneThisWeek.length){
    doneThisWeek.forEach(t=>{ r+=`✅ [${lineNames[t.line]}] ${t.text}\n`; });
  } else {
    r += `（本週尚無完成任務）\n`;
  }
  r += '\n';

  // 進行中
  const current = db.weekPlans.filter(t=>t.status==='current');
  r += `【現在進行中】\n`;
  if(current.length){
    current.forEach(t=>{ r+=`🔥 [${lineNames[t.line]||t.line}] ${t.text}${t.note?'  →備注：'+t.note:''}\n`; });
  } else {
    r += `（無進行中任務）\n`;
  }
  r += '\n';

  // 被擋住
  const blocked = db.weekPlans.filter(t=>t.status==='upcoming'&&!isUnlocked(t));
  r += `【被擋住的任務】\n`;
  if(blocked.length){
    blocked.forEach(t=>{
      const deps=(t.blockedBy||[]).map(id=>{const d=db.weekPlans.find(x=>x.id===id);return d?d.text:'?';});
      r+=`🔒 [${lineNames[t.line]||t.line}] ${t.text}\n    等待：${deps.join('、')}\n`;
    });
  } else {
    r += `（無被擋住任務）\n`;
  }
  r += '\n';

  // 可以開始但還沒開始
  const unlocked = db.weekPlans.filter(t=>t.status==='upcoming'&&isUnlocked(t));
  r += `【可以開始但還沒動】\n`;
  if(unlocked.length){
    unlocked.slice(0,6).forEach(t=>{ r+=`⬜ [${lineNames[t.line]||t.line}] W${t.week} ${t.text}\n`; });
    if(unlocked.length>6) r+=`    ...還有 ${unlocked.length-6} 個\n`;
  } else {
    r += `（無）\n`;
  }
  r += '\n';

  // 其他作業
  const assignments = db.assignments||[];
  const pendingA = assignments.filter(a=>!a.done);
  r += `【其他作業】\n`;
  if(pendingA.length){
    pendingA.forEach(a=>{
      const total=(a.tasks||[]).length;
      const done=(a.tasks||[]).filter(t=>t.done).length;
      const daysLeft=a.deadline?Math.ceil((new Date(a.deadline)-new Date(TODAY))/86400000):null;
      r+=`📚 ${a.name}${a.course?' ('+a.course+')':''}`;
      if(daysLeft!==null) r+=`  截止${daysLeft>0?daysLeft+'天後':daysLeft===0?'今天':'已過期'}`;
      if(total) r+=`  子任務 ${done}/${total}`;
      r+='\n';
    });
  } else {
    r += `（無待完成作業）\n`;
  }
  r += '\n';

  // 老師回饋（最近2筆）
  const recentFeedback = [...(db.feedbacks||[])].reverse().slice(0,2);
  if(recentFeedback.length){
    r += `【最近老師回饋】\n`;
    recentFeedback.forEach(f=>{
      r+=`💬 ${f.date} [${lineNames[f.line]||f.line}] ${f.text}`;
      if(f.action) r+=`\n    → 行動：${f.action}`;
      r+='\n';
    });
    r+='\n';
  }

  // 卡住的地方（待決策）
  const decisions=(db.decisions||[]).filter(d=>!d.resolved);
  r += `【卡住／待決策】\n`;
  if(decisions.length){
    decisions.forEach(d=>{ r+=`❓ ${d.text}\n`; });
  } else {
    r += `（無待決策項目）\n`;
  }

  r += '\n═══════════════════════════\n';
  r += `以上是我的現況，請幫我分析或調整任務。\n`;

  return r;
}

function showModal(html){
  let el=document.getElementById('_modal');
  if(!el){el=document.createElement('div');el.id='_modal';el.className='overlay';document.body.appendChild(el);}
  el.innerHTML=`<div class="modal">${html}</div>`;
  el.classList.add('open');
  el.onclick=e=>{if(e.target===el)closeModal();};
}
function closeModal(){
  const el=document.getElementById('_modal');
  if(el) el.classList.remove('open');
}
