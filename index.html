<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>中藥庫存管理</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f3ee;
      --bg2: #eceae3;
      --bg3: #e3e0d8;
      --card: #ffffff;
      --card2: #faf9f6;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.14);
      --text: #2c2c2a;
      --text2: #5f5e5a;
      --text3: #9a9890;
      --red: #a32d2d;
      --red-bg: #fcebeb;
      --red-border: #f7c1c1;
      --orange: #854f0b;
      --orange-bg: #faeeda;
      --orange-border: #fac775;
      --green: #0f6e56;
      --green-bg: #e6f5f1;
      --r: 10px;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
      overscroll-behavior: none;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 56px; background: var(--bg2);
      border-right: 1px solid var(--border2);
      display: flex; flex-direction: column;
      align-items: center; padding: 14px 0; gap: 4px;
      flex-shrink: 0;
    }
    .sib {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; cursor: pointer; transition: all .15s;
      background: transparent; border: none; color: var(--text3);
    }
    .sib:hover { background: var(--bg3); color: var(--text); }
    .sib.active { background: var(--text); color: #fff; }
    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .topbar {
      height: 50px; border-bottom: 1px solid var(--border2);
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
      flex-shrink: 0; background: var(--card);
    }
    .topbar-title { font-family: 'Noto Serif TC', serif; font-size: 15px; font-weight: 700; flex: 1; }
    .page { flex: 1; overflow-y: auto; padding: 20px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
    .page-title { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700; }
    .page-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* ── Cards & Items ── */
    .card {
      background: var(--card); border-radius: var(--r);
      padding: 16px; margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 6px; background: var(--card);
      transition: border-color .15s;
    }
    .item.low { border-color: var(--red-border); background: var(--red-bg); }
    .item.warn { border-color: var(--orange-border); background: var(--orange-bg); }
    .item-name { font-weight: 500; font-size: 15px; }
    .item-stock { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .item-stock.low-text { color: var(--red); font-weight: 500; }
    .item-stock.warn-text { color: var(--orange); font-weight: 500; }

    /* ── Stats ── */
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--card); border-radius: var(--r); padding: 14px; text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
    .stat-num { font-size: 24px; font-weight: 700; font-family: 'Noto Serif TC', serif; }
    .stat-num.danger { color: var(--red); }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 2px; background: var(--bg3);
      border-radius: 10px; padding: 4px; margin-bottom: 16px;
    }
    .tab {
      flex: 1; padding: 9px; font-size: 13px; background: transparent;
      border: none; border-radius: 7px; cursor: pointer; color: var(--text2);
      font-family: 'Noto Sans TC', sans-serif; transition: all .15s;
    }
    .tab.active { background: var(--card); color: var(--text); font-weight: 500; }

    /* ── Inputs & Buttons ── */
    input, select, button, textarea { font-family: 'Noto Sans TC', sans-serif; font-size: 15px; }
    input[type=text], input[type=number], input[type=date], select {
      padding: 10px 12px; border: 1px solid var(--border2);
      border-radius: 8px; background: var(--bg2); width: 100%;
      color: var(--text); outline: none; transition: border .15s;
    }
    input:focus, select:focus { border-color: var(--text2); background: var(--card); }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .row > input, .row > select { flex: 1; min-width: 0; }
    button.btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      background: var(--text); color: #fff; cursor: pointer;
      font-weight: 500; transition: opacity .15s; white-space: nowrap;
    }
    button.btn:hover { opacity: 0.85; }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
    button.btn-mini {
      padding: 6px 12px; font-size: 13px;
      border: 1px solid var(--border2); background: var(--card);
      color: var(--text2); border-radius: 6px; cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif; transition: all .15s;
    }
    button.btn-mini:hover { background: var(--bg2); }
    button.btn-danger { color: var(--red); }
    button.btn-ghost {
      padding: 6px 12px; font-size: 13px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); border-radius: 6px;
      cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: all .15s;
    }
    button.btn-ghost:hover { color: var(--text2); border-color: var(--border2); }

    /* ── Ingredient row ── */
    .ingredient-row {
      display: grid; grid-template-columns: 1fr 80px 36px;
      gap: 6px; margin-bottom: 6px;
    }
    .ingredient-row select, .ingredient-row input { font-size: 14px; padding: 8px 10px; }
    .ingredient-row .ing-remove {
      padding: 0; font-size: 18px; line-height: 1; color: var(--red);
      border: none; background: transparent; cursor: pointer;
    }

    /* ── Records ── */
    .record {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px; background: var(--card);
    }
    .record-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .record-date { font-weight: 500; font-size: 14px; }
    .record-list { font-size: 13px; color: var(--text2); line-height: 1.6; }

    /* ── Alerts & Messages ── */
    .alert-banner {
      background: var(--red-bg); color: var(--red);
      padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 12px; display: none;
    }
    .alert-banner.show { display: block; }
    .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .msg.success { color: var(--green); }
    .msg.error { color: var(--red); }
    .err-box {
      background: var(--red-bg); color: #791f1f;
      padding: 10px 14px; border-radius: 8px; font-size: 12px;
      margin: 8px 0; font-family: monospace; white-space: pre-wrap;
      word-break: break-all; display: none;
    }
    .err-box.show { display: block; }

    /* ── Settings ── */
    .settings-row { display: flex; gap: 8px; align-items: center; padding: 10px 0; }
    .settings-row label { font-size: 14px; color: var(--text2); flex-shrink: 0; }
    .settings-row input { width: 100px; flex: none; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 40px 0; color: var(--text3); font-size: 14px; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--bg3); border-top-color: var(--text2);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Sync badge ── */
    .sync-badge { font-size: 11px; color: var(--text3); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: #fff;
      border-radius: 20px; padding: 8px 18px;
      font-size: 13px; font-weight: 500;
      z-index: 999; pointer-events: none;
      opacity: 0; transition: opacity .3s; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Empty ── */
    .empty { text-align: center; color: var(--text3); font-size: 13px; padding: 24px 0; }

    /* ── Footer ── */
    .footer { text-align: center; padding: 16px 0; font-size: 12px; color: var(--text3); }
    .footer a { color: var(--text2); text-decoration: none; }

    /* ── Overlay / Modal ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      z-index: 100; display: none; align-items: center;
      justify-content: center; padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 14px;
      padding: 22px; width: 100%; max-width: 440px;
      max-height: 88vh; overflow-y: auto;
      border: 1px solid var(--border2);
    }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .fg { margin-bottom: 12px; }
    .fg label { font-size: 12px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 4px; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%; height: 56px; flex-direction: row;
        justify-content: space-around; position: fixed;
        bottom: 0; left: 0; right: 0; z-index: 50;
        border-top: 1px solid var(--border2); border-right: none;
        padding: 0 4px; gap: 0;
      }
      .sib { width: 44px; height: 44px; font-size: 19px; }
      .main { padding-bottom: 56px; height: 100vh; }
      .page { padding: 14px 12px; }
      .topbar { height: 46px; padding: 0 12px; }
      .topbar-title { font-size: 14px; }
      .stat-num { font-size: 20px; }
      .ingredient-row { grid-template-columns: 1fr 70px 32px; }
      input, select { font-size: 16px !important; }
      .overlay { align-items: flex-end; padding: 0; }
      .modal { border-radius: 16px 16px 0 0; max-width: 100%; max-height: 92vh; padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">中藥庫存管理</div>
      <div class="sync-badge" id="syncBadge"></div>
      <button class="btn-ghost" onclick="manualSave()" style="font-size:12px;padding:5px 10px;">💾 儲存</button>
    </div>
    <div class="page" id="pageContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ═══════════════════════════════
// CONFIG
// ═══════════════════════════════
const KEY = 'herb_v1';
const TODAY = new Date().toISOString().slice(0,10);

// ═══════════════════════════════
// DATA
// ═══════════════════════════════
function defDB() {
  return {
    _updatedAt: '',
    apiUrl: '',
    inventory: {},   // { 藥名: 庫存(錢) }
    records: [],     // [{ id, date, ingredients:[{name,amount}], createdAt }]
    threshold: 5,
  };
}

let db = (() => {
  try { return JSON.parse(localStorage.getItem(KEY)) || defDB(); }
  catch { return defDB(); }
})();

function saveDB() {
  db._updatedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(db));
}

// ═══════════════════════════════
// SYNC（Apps Script API）
// ═══════════════════════════════
function setSyncState(s) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  const map = { ok: '✓ 已同步', err: '✗ 同步失敗', loading: '⟳ 同步中' };
  el.textContent = map[s] || '';
  el.style.color = s==='ok' ? 'var(--green)' : s==='err' ? 'var(--red)' : 'var(--orange)';
  if (s==='ok'||s==='err') setTimeout(() => { el.textContent=''; }, 3000);
}

async function pushSync() {
  if (!db.apiUrl) return;
  setSyncState('loading');
  try {
    const resp = await fetch(db.apiUrl, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveAll', data: db })
    });
    const r = await resp.json();
    if (r.ok) setSyncState('ok'); else throw new Error(r.error);
  } catch(e) { setSyncState('err'); throw e; }
}

async function pullSync() {
  if (!db.apiUrl) { alert('請先在設定填入 Apps Script 網址'); return; }
  try {
    const cb = '_gc' + Date.now();
    const r = await new Promise((res, rej) => {
      window[cb] = d => { delete window[cb]; res(d); };
      const s = document.createElement('script');
      s.onerror = () => rej(new Error('error'));
      s.src = db.apiUrl + '?action=getAll&callback=' + cb + '&t=' + Date.now();
      setTimeout(() => rej(new Error('timeout')), 15000);
      document.head.appendChild(s);
    });
    if (r && !r.error) { Object.assign(db, r); saveDB(); renderAll(); toast('✓ 已從雲端載入'); }
  } catch(e) { toast('❌ 拉取失敗'); }
}

let _debTimer = null;
function save() {
  saveDB();
  clearTimeout(_debTimer);
  _debTimer = setTimeout(() => { if (db.apiUrl) pushSync(); }, 3000);
}

function manualSave() {
  saveDB();
  if (db.apiUrl) pushSync().then(() => toast('✅ 已存檔')).catch(() => toast('❌ 存檔失敗'));
  else toast('✓ 已存本機');
}

// ═══════════════════════════════
// UTILS
// ═══════════════════════════════
const uid = () => '_' + Math.random().toString(36).slice(2,8);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => Math.round((n||0) * 10) / 10;
const nowStr = () => new Date().toLocaleString('zh-TW');

function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function showMsg(id, text, isError) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'error' : 'success');
  if (!isError && text) setTimeout(() => { el.textContent = ''; }, 2500);
}

// ═══════════════════════════════
// NAV
// ═══════════════════════════════
const NAV = [
  { id: 'inventory', icon: '草', label: '庫存' },
  { id: 'add',       icon: '＋', label: '新增' },
  { id: 'brew',      icon: '煮', label: '熬煮' },
  { id: 'history',   icon: '紀', label: '紀錄' },
  { id: 'settings',  icon: '⚙',  label: '設定' },
];
let activeTab = 'inventory';

function renderNav() {
  document.getElementById('sidebar').innerHTML = NAV.map(n => `
    <button class="sib${activeTab===n.id?' active':''}" onclick="goto('${n.id}')" title="${n.label}">
      <span style="font-size:13px;font-family:'Noto Serif TC',serif">${n.icon}</span>
    </button>`).join('');
}

function goto(tab) { activeTab = tab; renderAll(); }
function renderAll() { renderNav(); renderPage(); }

// ═══════════════════════════════
// PAGES
// ═══════════════════════════════
function renderPage() {
  const el = document.getElementById('pageContent');
  switch (activeTab) {
    case 'inventory': el.innerHTML = pageInventory(); break;
    case 'add':       el.innerHTML = pageAdd(); break;
    case 'brew':      el.innerHTML = pageBrew(); break;
    case 'history':   el.innerHTML = pageHistory(); break;
    case 'settings':  el.innerHTML = pageSettings(); break;
  }
  if (activeTab === 'brew') renderBrewIngredientsIfEmpty();
}

// ─── 庫存頁 ───
function pageInventory() {
  const entries = Object.entries(db.inventory);
  const sum = entries.reduce((a,[,v]) => a + v, 0);
  const lowCount = entries.filter(([,v]) => v < db.threshold).length;
  const lowItems = entries.filter(([,v]) => v < db.threshold).map(([n]) => n);

  return `
  <div class="page-header">
    <div><div class="page-title">庫存總覽</div>
    <div class="page-sub">單位：錢</div></div>
  </div>

  ${lowItems.length ? `<div class="alert-banner show">⚠ 庫存不足：${lowItems.map(n=>`${esc(n)}(${fmt(db.inventory[n])}錢)`).join('、')} 低於 ${db.threshold} 錢</div>` : ''}

  <div class="stat-grid">
    <div class="stat"><div class="stat-label">藥材種類</div><div class="stat-num">${entries.length}</div></div>
    <div class="stat"><div class="stat-label">總庫存(錢)</div><div class="stat-num">${fmt(sum)}</div></div>
    <div class="stat"><div class="stat-label">庫存不足</div><div class="stat-num danger">${lowCount}</div></div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <input type="text" id="search" placeholder="搜尋藥名…" oninput="renderPage()" style="flex:1" />
    <select id="sort" style="flex:0 0 auto;width:auto" onchange="renderPage()">
      <option value="name">依藥名</option>
      <option value="asc">少→多</option>
      <option value="desc">多→少</option>
    </select>
  </div>

  <div id="inventory-list">${renderInventoryList()}</div>

  <div class="card" style="margin-top:16px">
    <div style="font-size:13px;color:var(--text2);margin-bottom:8px">庫存預警設定</div>
    <div class="settings-row">
      <label>低於</label>
      <input type="number" id="threshold-input" step="0.5" min="0" value="${db.threshold}" />
      <label>錢時警告</label>
      <button class="btn-mini" onclick="saveThreshold()">儲存</button>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="link-sheet" onclick="openSheetUrl(event)">📊 開啟 Google Sheets</a>
  </div>`;
}

function renderInventoryList() {
  const searchEl = document.getElementById('search');
  const sortEl = document.getElementById('sort');
  const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
  const sort = sortEl ? sortEl.value : 'name';

  let entries = Object.entries(db.inventory);
  if (search) entries = entries.filter(([n]) => n.toLowerCase().includes(search));
  if (sort === 'name') entries.sort((a,b) => a[0].localeCompare(b[0], 'zh-Hant'));
  else if (sort === 'asc') entries.sort((a,b) => a[1]-b[1]);
  else entries.sort((a,b) => b[1]-a[1]);

  if (!entries.length) return '<div class="empty">尚無藥材，前往「新增」開始</div>';

  const warnLevel = db.threshold * 2;
  return entries.map(([name, stock]) => {
    const cls = stock < db.threshold ? 'low' : stock < warnLevel ? 'warn' : '';
    const txtCls = stock < db.threshold ? 'low-text' : stock < warnLevel ? 'warn-text' : '';
    const tag = stock < db.threshold ? ' · ⚠ 不足' : stock < warnLevel ? ' · 注意' : '';
    return `<div class="item ${cls}">
      <div>
        <div class="item-name">${esc(name)}</div>
        <div class="item-stock ${txtCls}">${fmt(stock)} 錢${tag}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn-mini" onclick="adjustHerb('${esc(name)}')">+/−</button>
        <button class="btn-mini btn-danger" onclick="deleteHerb('${esc(name)}')">刪</button>
      </div>
    </div>`;
  }).join('');
}

// ─── 新增頁 ───
function pageAdd() {
  return `
  <div class="page-header"><div class="page-title">新增／補貨</div></div>
  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px">同名藥材會累加庫存</div>
    <div class="row">
      <input type="text" id="new-name" placeholder="藥名（例：當歸）" />
    </div>
    <div class="row">
      <input type="number" id="new-stock" placeholder="數量（錢）" step="0.5" min="0" />
      <button class="btn" id="btn-add" onclick="addHerb()">加入</button>
    </div>
    <div class="msg" id="add-msg"></div>
  </div>`;
}

// ─── 熬煮頁 ───
function pageBrew() {
  const today = TODAY;
  return `
  <div class="page-header"><div class="page-title">熬煮記錄</div></div>
  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px">儲存後自動從庫存扣除</div>
    <div class="row">
      <label style="font-size:14px;color:var(--text2);flex:0 0 auto">日期</label>
      <input type="date" id="brew-date" value="${today}" />
    </div>
    <div style="font-size:13px;color:var(--text2);margin:12px 0 6px">藥材清單</div>
    <div id="brew-ingredients"></div>
    <button class="btn-mini" id="btn-add-ing" onclick="addIngredientRow()" style="margin-top:4px">＋ 新增一味</button>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn" id="btn-save-brew" onclick="saveBrew()" style="flex:1">儲存並扣庫存</button>
      <button class="btn-mini" onclick="clearBrew()">清空</button>
    </div>
    <div class="msg" id="brew-msg"></div>
  </div>`;
}

function renderBrewIngredientsIfEmpty() {
  if (!document.querySelectorAll('.ingredient-row').length) addIngredientRow();
}

function addIngredientRow() {
  const wrap = document.getElementById('brew-ingredients');
  if (!wrap) return;
  const names = Object.keys(db.inventory).sort((a,b) => a.localeCompare(b,'zh-Hant'));
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  const optsHtml = '<option value="">選擇藥材…</option>'
    + names.map(n => `<option value="${esc(n)}">${esc(n)} (${fmt(db.inventory[n])}錢)</option>`).join('');
  row.innerHTML = `<select class="ing-name">${optsHtml}</select>
    <input type="number" class="ing-amount" placeholder="錢" step="0.5" min="0" />
    <button type="button" class="ing-remove" onclick="this.closest('.ingredient-row').remove();renderBrewIngredientsIfEmpty()">×</button>`;
  wrap.appendChild(row);
}

function clearBrew() {
  const wrap = document.getElementById('brew-ingredients');
  if (wrap) wrap.innerHTML = '';
  addIngredientRow();
  showMsg('brew-msg','',false);
}

// ─── 紀錄頁 ───
function pageHistory() {
  const sorted = [...db.records].sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const now = new Date();
  const ym = now.getFullYear() + '-' + ('0'+(now.getMonth()+1)).slice(-2);
  const monthCount = db.records.filter(r => String(r.date).startsWith(ym)).length;

  return `
  <div class="page-header"><div class="page-title">熬煮紀錄</div></div>
  <div class="stat-grid" style="grid-template-columns:1fr 1fr">
    <div class="stat"><div class="stat-label">總帖數</div><div class="stat-num">${db.records.length}</div></div>
    <div class="stat"><div class="stat-label">本月帖數</div><div class="stat-num">${monthCount}</div></div>
  </div>
  <div id="history-list">
    ${sorted.length ? sorted.map(r => `
      <div class="record">
        <div class="record-head">
          <div class="record-date">${esc(r.date)}</div>
          <button class="btn-mini btn-danger" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
        <div class="record-list">${r.ingredients.map(i => `${esc(i.name)} ${fmt(i.amount)}錢`).join('、')}</div>
      </div>`).join('')
    : '<div class="empty">尚無熬煮紀錄</div>'}
  </div>`;
}

// ─── 設定頁 ───
function pageSettings() {
  return `
  <div class="page-header"><div class="page-title">設定</div></div>

  <div class="card" style="margin-bottom:12px">
    <div style="font-weight:700;margin-bottom:10px">☁️ 雲端同步</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">填入 Apps Script 部署網址，資料會自動同步到 Google Sheets。不填也能正常使用（只存本機）。</div>
    <div class="fg">
      <label>Apps Script 網址</label>
      <input type="url" id="apiInp" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(db.apiUrl||'')}" />
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="saveApiUrl()">儲存網址</button>
      <button class="btn-ghost" onclick="pullSync()">↻ 從雲端拉取</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px;color:var(--red)">危險</div>
    <button class="btn-mini btn-danger" onclick="if(confirm('確定清除所有本機資料？'))clearAll()">清除所有本機資料</button>
  </div>`;
}

// ═══════════════════════════════
// ACTIONS
// ═══════════════════════════════

function addHerb() {
  const name = (document.getElementById('new-name').value || '').trim();
  const amount = parseFloat(document.getElementById('new-stock').value);
  if (!name) { showMsg('add-msg','請輸入藥名',true); return; }
  if (isNaN(amount) || amount < 0) { showMsg('add-msg','數量無效',true); return; }
  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  const cur = db.inventory[name] || 0;
  db.inventory[name] = Math.round((cur + amount) * 100) / 100;
  save();
  document.getElementById('new-name').value = '';
  document.getElementById('new-stock').value = '';
  showMsg('add-msg', `✓ 已加入：${name}（${fmt(db.inventory[name])} 錢）`, false);
  btn.disabled = false;
}

function adjustHerb(name) {
  const cur = db.inventory[name];
  if (cur === undefined) return;
  const v = prompt(`調整「${name}」庫存（目前 ${fmt(cur)} 錢）\n輸入 +5 增加、-3 減少、或直接輸入新數值`);
  if (v === null) return;
  const trimmed = v.trim();
  let newVal;
  if (trimmed.charAt(0) === '+' || trimmed.charAt(0) === '-') {
    const delta = parseFloat(trimmed);
    if (isNaN(delta)) return;
    newVal = cur + delta;
  } else {
    newVal = parseFloat(trimmed);
    if (isNaN(newVal)) return;
  }
  newVal = Math.max(0, Math.round(newVal * 100) / 100);
  db.inventory[name] = newVal;
  save(); renderAll(); toast(`✓ ${name} 調整為 ${fmt(newVal)} 錢`);
}

function deleteHerb(name) {
  if (!confirm(`確定刪除「${name}」？`)) return;
  delete db.inventory[name];
  save(); renderAll(); toast('已刪除');
}

function saveBrew() {
  const date = (document.getElementById('brew-date')||{}).value;
  if (!date) { showMsg('brew-msg','請選擇日期',true); return; }

  const rows = document.querySelectorAll('.ingredient-row');
  const ingredients = [];
  const errors = [];

  rows.forEach(row => {
    const name = row.querySelector('.ing-name').value;
    const amount = parseFloat(row.querySelector('.ing-amount').value);
    if (!name || isNaN(amount) || amount <= 0) return;
    if (!(name in db.inventory)) { errors.push(`${name} 不在庫存中`); return; }
    if (db.inventory[name] < amount) {
      errors.push(`${name} 庫存不足（剩 ${fmt(db.inventory[name])} 錢，需 ${amount} 錢）`);
    }
    ingredients.push({ name, amount });
  });

  if (!ingredients.length) { showMsg('brew-msg','請至少加入一味有效的藥材',true); return; }
  if (errors.length) { showMsg('brew-msg', errors.join('；'), true); return; }

  const btn = document.getElementById('btn-save-brew');
  btn.disabled = true;
  showMsg('brew-msg','儲存中…',false);

  // 扣庫存
  ingredients.forEach(it => {
    db.inventory[it.name] = Math.round((db.inventory[it.name] - it.amount) * 100) / 100;
  });

  // 新增紀錄
  db.records.push({ id: uid(), date, ingredients, createdAt: nowStr() });
  save();

  clearBrew();
  showMsg('brew-msg','✓ 已記錄並扣除庫存',false);
  btn.disabled = false;
}

function deleteRecord(id) {
  if (!confirm('刪除此筆紀錄？（不會回補庫存）')) return;
  db.records = db.records.filter(r => r.id !== id);
  save(); renderPage(); toast('已刪除');
}

function saveThreshold() {
  const v = parseFloat(document.getElementById('threshold-input').value);
  if (isNaN(v) || v < 0) { alert('數值無效'); return; }
  db.threshold = v;
  save(); renderAll(); toast('✓ 預警值已更新');
}

function saveApiUrl() {
  db.apiUrl = (document.getElementById('apiInp').value || '').trim();
  save(); toast('✓ 已儲存');
}

function clearAll() {
  localStorage.removeItem(KEY);
  location.reload();
}

function openSheetUrl(e) {
  e.preventDefault();
  if (!db.apiUrl) { alert('請先在設定填入 Apps Script 網址'); return; }
  // 嘗試從 API 取 sheet URL
  const url = db.apiUrl + '?action=getSheetUrl&t=' + Date.now();
  const cb = '_su' + Date.now();
  window[cb] = d => { delete window[cb]; if (d && d.url) window.open(d.url,'_blank'); };
  const s = document.createElement('script');
  s.src = url + '&callback=' + cb;
  document.head.appendChild(s);
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
renderAll();
// 10分鐘自動同步
setInterval(() => { if (db.apiUrl) pushSync(); }, 600000);
</script>
